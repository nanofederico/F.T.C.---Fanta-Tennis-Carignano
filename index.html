<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-main: #0b1120;
      --card-bg: #1e293b;
      --card-alt: #162032;
      --tennis-green: #22c55e;
      --tennis-lime: #a3e635;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 85px; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    header { background: #070d18; border-bottom: 1px solid var(--border-color); padding: 14px 20px; position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon { width: 34px; height: 34px; border-radius: 50%; background: var(--tennis-lime); display: flex; align-items: center; justify-content: center; font-size: 18px; color: #000; box-shadow: 0 0 10px rgba(163,230,53,0.3); }
    .brand-title { font-size: 17px; font-weight: 800; letter-spacing: -0.5px; }
    .brand-title span { color: var(--tennis-lime); }

    .view { display: none; padding: 16px; max-width: 900px; margin: 0 auto; }
    .view.active { display: block; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Classifica Team */
    .team-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 12px; overflow: hidden; transition: border-color 0.2s; cursor: pointer; }
    .team-card:hover { border-color: var(--tennis-green); }
    .team-header { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
    .team-info { display: flex; align-items: center; gap: 12px; }
    .rank-badge { width: 32px; height: 32px; border-radius: 8px; background: #0f172a; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; border: 1px solid var(--border-color); }
    .rank-1 { background: linear-gradient(135deg, #eab308, #ca8a04); color: #000; border: none; }
    .rank-2 { background: linear-gradient(135deg, #cbd5e1, #94a3b8); color: #000; border: none; }
    .rank-3 { background: linear-gradient(135deg, #b45309, #78350f); color: #fff; border: none; }
    .team-title { font-size: 16px; font-weight: 700; }
    .team-stats-preview { text-align: right; }
    .team-pts { font-size: 18px; font-weight: 800; color: var(--tennis-lime); }
    .team-gap { font-size: 11px; color: var(--text-muted); }

    .team-kpis { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card-alt); padding: 10px 14px; border-top: 1px solid var(--border-color); font-size: 12px; gap: 8px; }
    .kpi-item { display: flex; flex-direction: column; }
    .kpi-label { color: var(--text-muted); font-size: 10px; text-transform: uppercase; margin-bottom: 2px; }
    .kpi-val { font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Drawer Giocatori Roster */
    .drawer-roster { display: none; background: #0e1626; border-top: 1px solid var(--border-color); padding: 12px; }
    .team-card.expanded .drawer-roster { display: block; }
    .player-card-compact { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--card-bg); border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border-color); }
    .player-card-compact:last-child { margin-bottom: 0; }
    .p-left { display: flex; align-items: center; gap: 12px; }
    .p-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #1e293b; border: 1px solid var(--border-color); }
    .p-meta { display: flex; flex-direction: column; }
    .p-name { font-size: 14px; font-weight: 700; }
    .p-sub { font-size: 11px; color: var(--text-muted); }
    .p-right { text-align: right; }
    .p-points { font-size: 14px; font-weight: 800; color: var(--tennis-lime); }
    .p-share { font-size: 11px; color: var(--tennis-green); font-weight: 600; }

    /* Filtri & Ricerca */
    .search-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 170px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; color: #fff; outline: none; }
    .filter-select { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; color: #fff; outline: none; }

    /* Grafici */
    .chart-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
    .chart-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: var(--tennis-lime); display: flex; align-items: center; gap: 8px; }

    /* Albo d'Oro */
    .palmares-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .palmares-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; }
    .palmares-year { font-size: 18px; font-weight: 800; color: var(--tennis-lime); margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
    .palmares-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .palmares-medal { font-weight: 700; }

    /* Bottom Nav Bar */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #070d18; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 50; }
    .nav-btn { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; cursor: pointer; flex: 1; padding: 8px 0; }
    .nav-btn i { font-size: 18px; }
    .nav-btn.active { color: var(--tennis-lime); }

    /* Banner Installazione PWA */
    #pwa-install-banner { display: none; position: fixed; bottom: 75px; left: 16px; right: 16px; max-width: 500px; margin: 0 auto; background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--tennis-lime); border-radius: 12px; padding: 14px; z-index: 60; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .install-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .install-btn { background: var(--tennis-lime); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .dismiss-btn { background: transparent; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-baseball"></i></div>
      <div class="brand-title">RACE TO <span>TURIN</span></div>
    </div>
    <div style="font-size: 12px; color: var(--tennis-green); font-weight: 600;"><i class="fa-solid fa-circle" style="font-size:8px;"></i> Live</div>
  </header>

  <!-- 1. CLASSIFICA TEAM -->
  <main id="view-standings" class="view active">
    <div id="teams-list"></div>
  </main>

  <!-- 2. TUTTI I GIOCATORI -->
  <main id="view-players" class="view">
    <div class="search-bar">
      <input type="text" id="player-search" class="search-input" placeholder="Cerca tennista...">
      <select id="team-filter" class="filter-select">
        <option value="">Tutti i Team</option>
      </select>
    </div>
    <div id="players-list"></div>
  </main>

  <!-- 3. GRAFICI & ANALISI -->
  <main id="view-charts" class="view">
    <div class="chart-container">
      <div class="chart-title"><i class="fa-solid fa-chart-line"></i> Storico Classifica (7 Rilevazioni)</div>
      <canvas id="historyChart" style="max-height: 290px;"></canvas>
    </div>
    <div class="chart-container">
      <div class="chart-title"><i class="fa-solid fa-chart-bar"></i> Top 10 Tennisti (Punti Race)</div>
      <canvas id="topPlayersChart" style="max-height: 330px;"></canvas>
    </div>
  </main>

  <!-- 4. ALBO D'ORO -->
  <main id="view-palmares" class="view">
    <div class="palmares-grid" id="palmares-container"></div>
  </main>

  <!-- BANNER INSTALLAZIONE -->
  <div id="pwa-install-banner">
    <div class="install-inner">
      <div style="font-size: 13px;">Installa l'app Fantatennis sulla schermata home!</div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="install-btn" id="btn-pwa-install">Installa</button>
        <button class="dismiss-btn" id="btn-pwa-dismiss"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
  </div>

  <!-- BOTTOM BAR FISSA -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('standings', this)"><i class="fa-solid fa-trophy"></i>Classifica</button>
    <button class="nav-btn" onclick="switchTab('players', this)"><i class="fa-solid fa-users"></i>Giocatori</button>
    <button class="nav-btn" onclick="switchTab('charts', this)"><i class="fa-solid fa-chart-line"></i>Grafici</button>
    <button class="nav-btn" onclick="switchTab('palmares', this)"><i class="fa-solid fa-crown"></i>Albo d'Oro</button>

      {"rank": 249, "name": "Jérôme Kym", "age": 23, "nation": "SUI", "pts": 193, "team": "FEDE NANO", "photo": ""},
      {"rank": 257, "name": "Sumit Nagal", "age": 29, "nation": "IND", "pts": 186, "team": "MANU", "photo": ""},
      {"rank": 267, "name": "Luca Nardi", "age": 23, "nation": "ITA", "pts": 180, "team": "ENRY", "photo": ""},
      {"rank": 283, "name": "Juncheng Shang", "age": 21, "nation": "CHN", "pts": 170, "team": "EDU-NOVA", "photo": ""},
      {"rank": 372, "name": "Thanasi Kokkinakis", "age": 30, "nation": "AUS", "pts": 118, "team": "FLACO", "photo": ""},
      {"rank": 386, "name": "Kei Nishikori", "age": 36, "nation": "JPN", "pts": 111, "team": "BELTRI-MATTE", "photo": ""},
      {"rank": 401, "name": "Kasidit Samrej", "age": 25, "nation": "THA", "pts": 108, "team": "EDU-NOVA", "photo": ""},
      {"rank": 562, "name": "Jordan Thompson", "age": 32, "nation": "AUS", "pts": 62, "team": "CARE", "photo": ""},
      {"rank": 632, "name": "Arthur Cazaux", "age": 24, "nation": "FRA", "pts": 50, "team": "ENRY", "photo": ""},
      {"rank": 640, "name": "Max Purcell", "age": 28, "nation": "AUS", "pts": 49, "team": "FEDE NANO", "photo": ""},
      {"rank": 810, "name": "Nicolás Jarry", "age": 30, "nation": "CHI", "pts": 30, "team": "ENRY", "photo": ""},
      {"rank": 883, "name": "David Goffin", "age": 35, "nation": "BEL", "pts": 24, "team": "CARE", "photo": ""}
    ];

    /* 2. DATI STORICI DELLE 7 RILEVAZIONI (FOGLIO 'STORICO CLASS. TEAM') */
    const HISTORIC_DATES = ["02/02/2026", "23/02/2026", "17/03/2026", "17/04/2026", "18/05/2026", "11/06/2026", "13/07/2026"];
    const HISTORIC_DATA = {
      "MANU": [2110, 2460, 5152, 7026, 8964, 12813, 14375],
      "FEDE NANO": [1788, 1975, 5590, 8841, 11415, 12920, 15306],
      "CARE": [3389, 4650, 6597, 8582, 9887, 10860, 12835],
      "BELTRI-MATTE": [3320, 4971, 6173, 7732, 9328, 10693, 12155],
      "EDU-NOVA": [2158, 2523, 5041, 6294, 7718, 10191, 10473],
      "FLACO": [1236, 2754, 4145, 6260, 8899, 9791, 10321],
      "ENRY": [1092, 1933, 3578, 4500, 5216, 6186, 7487]
    };

    /* 3. ALBO D'ORO STORICO (FOGLIO 'ALBO D'ORO (2)') */
    const PALMARES_DATA = [
      {"year": 2025, "first": "CATENA", "second": "FEDE NANO", "third": "BELTRI-MATTE"},
      {"year": 2024, "first": "DODO", "second": "BELTRI-MATTE", "third": "ENRY"},
      {"year": 2022, "first": "CATENA", "second": "N/D", "third": "N/D"},
      {"year": 2021, "first": "BELTRI MATTE", "second": "FEDE NANO", "third": "DODO"},
      {"year": 2020, "first": "BELTRI-MATTE", "second": "ENRY", "third": "FEDENANO"},
      {"year": 2019, "first": "FEDE NANO", "second": "FLACO", "third": "ENRY"}
    ];

    /* CALCOLO STATISTICHE E AGGREGAZIONI TEAM */
    const teamMap = {};
    PLAYERS_DATA.forEach(p => {
      if (!teamMap[p.team]) teamMap[p.team] = { name: p.team, players: [], totalPts: 0 };
      teamMap[p.team].players.push(p);
      teamMap[p.team].totalPts += p.pts;
    });

    const teams = Object.values(teamMap).sort((a, b) => b.totalPts - a.totalPts);
    const topPts = teams[0].totalPts;

    teams.forEach(t => {
      t.gap = topPts - t.totalPts;
      t.avg = Math.round(t.totalPts / t.players.length);
      t.players.sort((a, b) => b.pts - a.pts);
      t.topScorer = t.players[0];
      t.players.forEach(p => {
        p.share = ((p.pts / t.totalPts) * 100).toFixed(1);
      });
    });

    /* RENDER CLASSIFICA TEAM CON DRAWER */
    function renderStandings() {
      const container = document.getElementById("teams-list");
      container.innerHTML = teams.map((team, index) => {
        const rank = index + 1;
        const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
        const gapText = rank === 1 ? 'LEADER' : `-${team.gap.toLocaleString()} pti`;

        const rosterHtml = team.players.map(p => `
          <div class="player-card-compact">
            <div class="p-left">
              <img class="p-avatar" src="${p.photo}" onerror="this.src='https://placehold.co/80x80/1e293b/a3e635?text=${p.name.charAt(0)}'" alt="${p.name}">
              <div class="p-meta">
                <span class="p-name">${p.name}</span>
                <span class="p-sub">${p.nation} • ${p.age} anni • #${p.rank} Race</span>
              </div>
            </div>
            <div class="p-right">
              <div class="p-points">${p.pts.toLocaleString()}</div>
              <div class="p-share">${p.share}% team</div>
            </div>
          </div>
        `).join('');

        return `
          <div class="team-card" onclick="toggleRoster(this)">
            <div class="team-header">
              <div class="team-info">
                <div class="rank-badge ${rankClass}">${rank}</div>
                <div class="team-title">${team.name}</div>
              </div>
              <div class="team-stats-preview">
                <div class="team-pts">${team.totalPts.toLocaleString()}</div>
                <div class="team-gap">${gapText}</div>
              </div>
            </div>
            <div class="team-kpis">
              <div class="kpi-item">
                <span class="kpi-label">Media Punti</span>
                <span class="kpi-val">${team.avg.toLocaleString()}</span>
              </div>
              <div class="kpi-item">
                <span class="kpi-label">Top Scorer</span>
                <span class="kpi-val">${team.topScorer.name.split(' ').pop()} (${team.topScorer.pts})</span>
              </div>
              <div class="kpi-item">
                <span class="kpi-label">Roster</span>
                <span class="kpi-val">${team.players.length} tennisti</span>
              </div>
            </div>
            <div class="drawer-roster">${rosterHtml}</div>
          </div>
        `;
      }).join('');
    }

    function toggleRoster(card) {
      card.classList.toggle('expanded');
    }

    /* RENDER SEZIONE TUTTI I GIOCATORI */
    function renderPlayers() {
      const select = document.getElementById("team-filter");
      teams.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t.name;
        opt.innerText = t.name;
        select.appendChild(opt);
      });

      filterPlayers();
      document.getElementById("player-search").addEventListener("input", filterPlayers);
      document.getElementById("team-filter").addEventListener("change", filterPlayers);
    }

    function filterPlayers() {
      const search = document.getElementById("player-search").value.toLowerCase();
      const teamFilter = document.getElementById("team-filter").value;
      const container = document.getElementById("players-list");

      const filtered = PLAYERS_DATA.filter(p => {
        const matchName = p.name.toLowerCase().includes(search);
        const matchTeam = !teamFilter || p.team === teamFilter;
        return matchName && matchTeam;
      }).sort((a,b) => b.pts - a.pts);

      container.innerHTML = filtered.map(p => `
        <div class="player-card-compact" style="margin-bottom:8px;">
          <div class="p-left">
            <img class="p-avatar" src="${p.photo}" onerror="this.src='https://placehold.co/80x80/1e293b/a3e635?text=${p.name.charAt(0)}'" alt="${p.name}">
            <div class="p-meta">
              <span class="p-name">${p.name}</span>
              <span class="p-sub"><b style="color:var(--tennis-lime);">${p.team}</b> • ${p.nation} (${p.age} anni)</span>
            </div>
          </div>
          <div class="p-right">
            <div class="p-points">${p.pts.toLocaleString()}</div>
            <div class="p-share">#${p.rank} Race</div>
          </div>
        </div>
      `).join('');
    }

    /* RENDER ALBO D'ORO */
    function renderPalmares() {
      const container = document.getElementById("palmares-container");
      container.innerHTML = PALMARES_DATA.map(item => `
        <div class="palmares-card">
          <div class="palmares-year">${item.year}</div>
          <div class="palmares-row"><span class="palmares-medal" style="color:#eab308">🥇 1° Posto</span> <span><b>${item.first}</b></span></div>
          <div class="palmares-row"><span class="palmares-medal" style="color:#94a3b8">🥈 2° Posto</span> <span><b>${item.second}</b></span></div>
          <div class="palmares-row"><span class="palmares-medal" style="color:#b45309">🥉 3° Posto</span> <span><b>${item.third}</b></span></div>
        </div>
      `).join('');
    }

    /* GRAFICI CHART.JS */
    let historyChart, topPlayersChart;
    function initCharts() {
      // 1. Line Chart Andamento Storico
      const teamColors = {
        'MANU': '#22c55e',
        'FEDE NANO': '#a3e635',
        'CARE': '#38bdf8',
        'BELTRI-MATTE': '#fbbf24',
        'EDU-NOVA': '#f87171',
        'FLACO': '#c084fc',
        'ENRY': '#f472b6'
      };

      const datasets = Object.keys(HISTORIC_DATA).map(tName => ({
        label: tName,
        data: HISTORIC_DATA[tName],
        borderColor: teamColors[tName] || '#94a3b8',
        backgroundColor: teamColors[tName] || '#94a3b8',
        tension: 0.25,
        borderWidth: 2,
        pointRadius: 3
      }));

      const ctx1 = document.getElementById('historyChart').getContext('2d');
      historyChart = new Chart(ctx1, {
        type: 'line',
        data: { labels: HISTORIC_DATES, datasets },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, color: '#94a3b8', font: { size: 10 } } } },
          scales: {
            x: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8', font: { size: 9 } } },
            y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8', font: { size: 9 } } }
          }
        }
      });

      // 2. Bar Chart Top 10 Giocatori con (Team)
      const top10 = [...PLAYERS_DATA].sort((a,b) => b.pts - a.pts).slice(0, 10).reverse();
      const ctx2 = document.getElementById('topPlayersChart').getContext('2d');
      topPlayersChart = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: top10.map(p => `${p.name} (${p.team})`),
          datasets: [{
            label: 'Punti Race',
            data: top10.map(p => p.pts),
            backgroundColor: '#a3e635',
            borderRadius: 4
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } },
            y: { grid: { display: false }, ticks: { color: '#f8fafc', font: { size: 10 } } }
          }
        }
      });
    }

    /* CONTROLLER SCHEDE */
    function switchTab(viewId, btn) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('view-' + viewId).classList.add('active');
      btn.classList.add('active');
      window.scrollTo(0, 0);
    }

    /* GESTIONE PWA */
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwa-install-banner').style.display = 'block';
    });

    document.getElementById('btn-pwa-install').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('pwa-install-banner').style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    document.getElementById('btn-pwa-dismiss').addEventListener('click', () => {
      document.getElementById('pwa-install-banner').style.display = 'none';
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderStandings();
      renderPlayers();
      renderPalmares();
      initCharts();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    });
  </script>
</body>
